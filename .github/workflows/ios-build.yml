# Builds development builds of the app:
#  - iOS: UNSIGNED .ipa on a GitHub macOS runner; SideStore re-signs it with a
#    free Apple ID when installing.
#  - Android: standalone release .apk (debug-key signed), installs directly.
#    64-bit and 32-bit build in parallel, and the release is published as soon
#    as Android is done (iOS adds its .ipa when it finishes).
name: App builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'src/**'
      - 'assets/**'
      - 'patches/**'
      - 'plugins/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'certs/**'
      - '.fingerprintignore'
      - 'scripts/ota-publish.mjs'
      - '.github/workflows/ios-build.yml'

# Least privilege; only the release job can write.
permissions:
  contents: read

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # Exact iOS looks as LUTs for Android (artifact "looks"; copy into
      # modules/lens-camera/android/src/main/assets/looks/ when Looks.swift changes).
      - name: Bake looks for Android
        working-directory: modules/lens-camera
        # A helper, not the app: never let it fail the iOS build.
        continue-on-error: true
        run: |
          swiftc -O tools/bake-looks/main.swift ios/Imaging/Looks.swift -o "$RUNNER_TEMP/bake-looks"
          "$RUNNER_TEMP/bake-looks" "$RUNNER_TEMP/looks"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: looks
          path: ${{ runner.temp }}/looks
          retention-days: 30

      - name: Install ccache
        run: brew install ccache

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-ios-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-ios-${{ hashFiles('package-lock.json') }}-
            ccache-ios-

      - name: Restore CocoaPods cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('package-lock.json') }}
          restore-keys: pods-

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform ios --clean --no-install
        env:
          CI: 1

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build (unsigned)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          # Full log goes to a file; on failure print every error and fail the job.
          if ! xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build > xcodebuild.log 2>&1; then
            echo "::group::Compiler errors"
            grep -E "error:" xcodebuild.log | sort -u | head -100
            echo "::endgroup::"
            tail -40 xcodebuild.log
            exit 1
          fi
          grep -E "warning: .*modules/lens-camera" xcodebuild.log | sort -u | head -50 || true
          ccache -s || true

      - name: Verify app binary
        run: |
          # An .app folder can exist even when compilation failed; check the executable.
          APP=$(ls -d build/Build/Products/Debug-iphoneos/*.app | head -1)
          EXE=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP/Info.plist")
          test -s "$APP/$EXE" || { echo "::error::$APP/$EXE missing"; exit 1; }
          ls -lh "$APP/$EXE"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

      - name: Package .ipa
        run: |
          APP=$(ls -d build/Build/Products/Debug-iphoneos/*.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Lens-dev.ipa Payload
          ls -lh Lens-dev.ipa

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios
          path: Lens-dev.ipa
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            apk: Lens.apk
          - abi: armeabi-v7a
            apk: Lens-32bit.apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # setup-java's built-in Gradle cache needs build files that only exist
      # after prebuild, so cache Gradle's directories directly.
      - name: Restore Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.abi }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ matrix.abi }}-
            gradle-

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: 1

      # Standalone app with the JS bundled in, signed with the template's debug
      # key (fine for sideloading). One CPU type per job: 64-bit phones, and
      # 32-bit phones (Android Go / older budget phones), built in parallel.
      - name: Build APK
        working-directory: android
        # The template's 2 GB heap / 512 MB metaspace ran out in lintVital once
        # expo-updates was added (runners have 16 GB).
        run: >
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=${{ matrix.abi }}
          "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}

      # Which update channel this APK listens to (OTA updates must match it).
      - name: Runtime version
        run: npx expo-updates runtimeversion:resolve --platform android | jq -r .runtimeVersion | tee runtime-${{ matrix.abi }}.txt

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-${{ matrix.abi }}-release.apk ${{ matrix.apk }}
          ls -lh ${{ matrix.apk }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-${{ matrix.abi }}
          path: |
            ${{ matrix.apk }}
            runtime-${{ matrix.abi }}.txt
          retention-days: 14

  # Over-the-air update: the JS of this commit for apps built with the same
  # native code (runtime version = fingerprint). Phones get it in ~2 minutes
  # without reinstalling; signed with our key (the app rejects anything else).
  ota:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # GitHub OIDC -> a 1-hour AWS session for the website deploy role (same bucket).
      - name: AWS credentials (OIDC)
        env:
          ROLE: ${{ vars.WEB_DEPLOY_ROLE_ARN }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          CREDS=$(aws sts assume-role-with-web-identity --role-arn "$ROLE" --role-session-name "gh-ota-$GITHUB_RUN_ID" \
            --web-identity-token "$TOKEN" --duration-seconds 3600 --query Credentials --output json)
          for k in AccessKeyId:AWS_ACCESS_KEY_ID SecretAccessKey:AWS_SECRET_ACCESS_KEY SessionToken:AWS_SESSION_TOKEN; do
            v=$(echo "$CREDS" | jq -r ".${k%%:*}")
            echo "::add-mask::$v"
            echo "${k##*:}=$v" >> "$GITHUB_ENV"
          done
          echo "AWS_REGION=ap-south-1" >> "$GITHUB_ENV"

      - name: Publish Android update
        run: node scripts/ota-publish.mjs android
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
          WEB_ORIGIN: ${{ vars.EXPO_PUBLIC_WEB_URL }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}

  # Published as soon as Android is ready (the usual test path); iOS adds its
  # .ipa to the same release in ios-release.
  release:
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: 'android-*'
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist
          RUNTIME=$(cat dist/runtime-arm64-v8a.txt)
          rm dist/runtime-*.txt
          TAG="dev-${{ github.run_number }}"
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Lens dev build #${{ github.run_number }}" \
            --notes "Builds from ${GITHUB_SHA::7} (runtime $RUNTIME: later JS changes for this runtime arrive as in-app updates).
          - Android: **Lens.apk** is the normal app, open it on the phone and install.
          - Older/budget Android phones that say \"App not installed\" with Lens.apk: use **Lens-32bit.apk**.
          - iPhone/iPad: Lens-dev.ipa (added when the iOS build finishes) installs with SideStore and loads JS from Metro." \
            --prerelease

  ios-release:
    needs: [ios, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios
          path: dist

      - name: Add the iOS app to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "dev-${{ github.run_number }}" dist/* --repo "$GITHUB_REPOSITORY"
