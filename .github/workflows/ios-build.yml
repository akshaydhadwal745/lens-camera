# Builds development builds of the app:
#  - iOS: UNSIGNED .ipa on a GitHub macOS runner; SideStore re-signs it with a
#    free Apple ID when installing.
#  - Android: debug-signed .apk on a Linux runner; installs directly.
# JS/UI changes load live from Metro (npm run tunnel); only native changes
# (modules/, app.json, dependencies) need a new build.
name: App builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'src/**'
      - 'assets/**'
      - 'patches/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-build.yml'

# Least privilege; only the release job can write.
permissions:
  contents: read

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install ccache
        run: brew install ccache

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-ios-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-ios-${{ hashFiles('package-lock.json') }}-
            ccache-ios-

      - name: Restore CocoaPods cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('package-lock.json') }}
          restore-keys: pods-

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform ios --clean --no-install
        env:
          CI: 1

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build (unsigned)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          # Full log goes to a file; on failure print every error and fail the job.
          if ! xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build > xcodebuild.log 2>&1; then
            echo "::group::Compiler errors"
            grep -E "error:" xcodebuild.log | sort -u | head -100
            echo "::endgroup::"
            tail -40 xcodebuild.log
            exit 1
          fi
          grep -E "warning: .*modules/lens-camera" xcodebuild.log | sort -u | head -50 || true
          ccache -s || true

      - name: Verify app binary
        run: |
          # An .app folder can exist even when compilation failed; check the executable.
          APP=$(ls -d build/Build/Products/Debug-iphoneos/*.app | head -1)
          EXE=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP/Info.plist")
          test -s "$APP/$EXE" || { echo "::error::$APP/$EXE missing"; exit 1; }
          ls -lh "$APP/$EXE"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

      - name: Package .ipa
        run: |
          APP=$(ls -d build/Build/Products/Debug-iphoneos/*.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Lens-dev.ipa Payload
          ls -lh Lens-dev.ipa

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios
          path: Lens-dev.ipa
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # setup-java's built-in Gradle cache needs build files that only exist
      # after prebuild, so cache Gradle's directories directly.
      - name: Restore Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: 1

      # Debug = dev client (JS from Metro). Release = standalone app with the
      # JS bundled in, signed with the template's debug key (fine for sideloading).
      - name: Build APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}

      - name: Collect APKs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Lens-dev.apk
          cp android/app/build/outputs/apk/release/app-release.apk Lens.apk
          ls -lh Lens-dev.apk Lens.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: |
            Lens.apk
            Lens-dev.apk
          retention-days: 14

  release:
    needs: [ios, android]
    if: ${{ always() && (needs.ios.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IOS: ${{ needs.ios.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          ls -lh dist
          TAG="dev-${{ github.run_number }}"
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Lens dev build #${{ github.run_number }}" \
            --notes "Builds from ${GITHUB_SHA::7} (iOS: $IOS, Android: $ANDROID).
          - Android: **Lens.apk** is the normal app, open it on the phone and install.
          - Android (developers): Lens-dev.apk loads JS from Metro (npm run tunnel).
          - iPhone/iPad: install Lens-dev.ipa with SideStore (loads JS from Metro)." \
            --prerelease
