plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.lenscamera'
version = '1.0.0'

android {
  namespace "expo.modules.lenscamera"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

// Same fix as expo-camera: CameraX needs the real ListenableFuture class, which
// React Native's Guava would otherwise replace with an empty jar.
configurations.configureEach {
  resolutionStrategy.force "com.google.guava:listenablefuture:1.0"
}

dependencies {
  // Same CameraX version expo-camera already ships, so the APK carries one copy.
  def camerax_version = "1.6.0"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-video:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  implementation "androidx.camera:camera-extensions:${camerax_version}"
  implementation "androidx.exifinterface:exifinterface:1.4.2"
  implementation "androidx.core:core-ktx:1.18.0"

  // Video export with looks. Same Media3 version expo-video ships.
  def media3_version = "1.9.0"
  implementation "androidx.media3:media3-transformer:${media3_version}"
  implementation "androidx.media3:media3-effect:${media3_version}"
  implementation "androidx.media3:media3-common:${media3_version}"
  // Live looks on playback: setVideoLook reaches expo-video's ExoPlayer.
  implementation "androidx.media3:media3-exoplayer:${media3_version}"

  // Portrait: person segmentation, model bundled in the app (no Play services needed).
  implementation "com.google.mlkit:segmentation-selfie:16.0.0-beta6"
  // Portrait for pets/objects when no person is found: ML Kit subject segmentation
  // (model from Google Play services, ~200 KB in the app; phones without Play services stay people-only).
  implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
  // Smart look suggestion: scene labels (model from Play services, ~200 KB in the app).
  implementation "com.google.android.gms:play-services-mlkit-image-labeling:16.0.8"
  // Smart burst: eyes open / smiles when picking the best shot (Play services; sharpness-only without it).
  implementation "com.google.android.gms:play-services-mlkit-face-detection:17.1.0"
  // QR codes in the camera (checklist 9.3): the same bundled scanner expo-camera already ships (no extra size).
  implementation "com.google.mlkit:barcode-scanning:17.3.0"
  // Document scanning (checklist 9.4): Google's scanner flow from Play services (downloaded on first use).
  implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0"
  // Self-test: ModuleInstall reports whether the Play services models above are on the phone.
  implementation "com.google.android.gms:play-services-base:18.5.0"
  // People (docs/design/people.md): LiteRT runtime from Google Play services, so the face
  // model runs without adding a TFLite engine to the APK. The model downloads on opt-in.
  implementation "com.google.android.gms:play-services-tflite-java:16.4.0"

  testImplementation "junit:junit:4.13.2"
}
