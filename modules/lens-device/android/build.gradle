plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.lensdevice'
version = '1.0.0'

android {
  namespace "expo.modules.lensdevice"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Google Play Install Referrer: which invite/affiliate link brought this install.
  implementation 'com.android.installreferrer:installreferrer:2.2'
}
