<!doctype html>
<html lang="en">
<head>

<title>Lens Console · Growth (prototype)</title>
<style>
/* Prototype of the redesigned Growth workspace in Lens Console. Same tokens as console/src/styles.css. */
:root {
  --bg: #f6f6f4; --panel: #ffffff; --side: #fbfbfa; --text: #16171a; --muted: #6b6f76; --line: #e6e6e2;
  --accent: #1f5eff; --accent-soft: #e8efff;
  --good: #137a3d; --good-soft: #e3f4ea; --warn: #8a5a00; --warn-soft: #fdf1d8; --bad: #b42318; --bad-soft: #fde7e5;
  --radius: 12px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f1012; --panel: #17181b; --side: #131416; --text: #ececec; --muted: #9a9ea6; --line: #2a2c30;
  --accent: #6b97ff; --accent-soft: #1c2640; --good: #5fd08c; --good-soft: #15301f; --warn: #f0c060; --warn-soft: #33290f;
  --bad: #ff7b6e; --bad-soft: #3a1714; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
button { font: inherit; cursor: pointer; }
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100%; }
/* sidebar */
.side { background: var(--side); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; padding: 4px 8px 14px; }
.brand i { width: 26px; height: 26px; border-radius: 8px; background: var(--text); display: grid; place-items: center; color: var(--bg); font-style: normal; font-size: 13px; }
.grp { font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 4px; }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 8px; color: var(--text); font-size: 14px; border: 0; background: none; text-align: left; width: 100%; }
.nav:hover { background: var(--line); }
.nav.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav.sub { padding-left: 22px; font-size: 13.5px; }
.nav .ct { font-size: 11px; font-weight: 650; color: var(--muted); }
.nav .ct.hot { color: var(--bad); }
.dim { color: var(--muted); }
.me { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 10px 0; font-size: 13px; }
/* main */
.main { padding: 22px 28px 60px; display: grid; gap: 18px; align-content: start; min-width: 0; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
.head p { margin: 2px 0 0; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 9px; padding: 7px 12px; font-weight: 600; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.pr { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card > h2, .card > .ch h2 { margin: 0; font-size: 15px; }
.ch { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; }
.stat .l { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .s { font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
.good { background: var(--good-soft); color: var(--good); } .warn { background: var(--warn-soft); color: var(--warn); } .bad { background: var(--bad-soft); color: var(--bad); }
.acc { background: var(--accent-soft); color: var(--accent); } .plain { background: var(--side); color: var(--muted); border: 1px solid var(--line); }
.kr { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.kr .t { font-size: 13.5px; } .kr .n { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
.bar { grid-column: 1 / -1; height: 7px; background: var(--line); border-radius: 99px; position: relative; overflow: visible; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bar > i.good { background: var(--good); } .bar > i.warn { background: var(--warn); } .bar > i.bad { background: var(--bad); }
.bar > em { position: absolute; top: -3px; width: 2px; height: 13px; background: var(--text); opacity: .5; border-radius: 1px; }
.task { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.task:first-child { border-top: 0; }
.task:hover .tt { color: var(--accent); }
.tt { font-weight: 600; font-size: 13.5px; }
.tm { font-size: 12px; color: var(--muted); }
.pri { font: 700 11px/1 ui-monospace, Menlo, monospace; text-align: center; padding: 5px 0; border-radius: 6px; }
.p0 { background: var(--bad-soft); color: var(--bad); } .p1 { background: var(--warn-soft); color: var(--warn); } .p2 { background: var(--accent-soft); color: var(--accent); } .p3 { background: var(--side); color: var(--muted); border: 1px solid var(--line); }
.list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.list li .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-top: 7px; flex: none; }
.board { display: grid; grid-template-columns: repeat(6, minmax(190px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--side); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 190px; }
.col h3 { margin: 0 2px 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; justify-content: space-between; }
.tc { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 6px; cursor: pointer; font-size: 13px; }
.tc:hover { border-color: var(--accent); }
.tc .tt { font-size: 13px; }
.tc .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ws { font-size: 11px; color: var(--muted); }
.av { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 700; color: #fff; flex: none; }
.av.ak { background: #5b6bff; } .av.pr { background: #d0632f; } .av.ag { background: #11806a; } .av.nn { background: var(--line); color: var(--muted); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: none; padding: 8px 12px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--text); border-color: var(--accent); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 4px 10px; font-size: 12.5px; color: var(--text); }
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--side); }
.tw { overflow-x: auto; }
.rm { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; }
.rmcol { display: grid; gap: 10px; align-content: start; }
.rmcol > h3 { margin: 0; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.obj { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; }
.obj h4 { margin: 0; font-size: 14px; }
.ms { border-top: 1px dashed var(--line); padding-top: 8px; font-size: 12.5px; display: grid; gap: 4px; }
.stages { display: grid; grid-template-columns: repeat(6, minmax(170px, 1fr)); gap: 10px; overflow-x: auto; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); gap: 8px; overflow-x: auto; }
.day { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 120px; display: grid; gap: 6px; align-content: start; }
.day b { font-size: 12px; color: var(--muted); }
.post { border-radius: 8px; padding: 6px 8px; font-size: 12px; display: grid; gap: 2px; cursor: pointer; }
.post.ig { background: #fbe7f3; color: #8a1d5e; } .post.yt { background: #fde7e5; color: #9e1c13; } .post.rd { background: #fff0e3; color: #973d00; } .post.wa { background: #e3f4ea; color: #126b36; } .post.li { background: #e8efff; color: #1a46b8; }
@media (prefers-color-scheme: dark) { .post.ig { background: #3a1730; color: #f2a6d4; } .post.yt { background: #3a1714; color: #ff9d93; } .post.rd { background: #3a2410; color: #ffb37a; } .post.wa { background: #15301f; color: #7fdca4; } .post.li { background: #1c2640; color: #9db8ff; } }
/* drawer */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .32); display: none; z-index: 20; }
.scrim.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); border-left: 1px solid var(--line); z-index: 21; transform: translateX(100%); transition: transform .2s ease; overflow-y: auto; padding: 22px 24px 40px; display: grid; gap: 16px; align-content: start; }
.drawer.open { transform: none; }
.drawer h2 { margin: 0; font-size: 19px; }
dl.kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 14px; margin: 0; font-size: 13.5px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; }
.cm { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 13px; }
.cm .when { color: var(--muted); font-size: 12px; }
.hist { font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; border-left: 2px solid var(--line); padding-left: 12px; }
textarea { width: 100%; min-height: 60px; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--bg); color: var(--text); font: inherit; resize: vertical; }
.spark { width: 100%; height: 40px; }
.note { font-size: 12px; color: var(--muted); }
.evid { background: var(--side); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: grid; gap: 4px; }
@media (max-width: 860px) { .app { grid-template-columns: 1fr; } .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; } .grp, .me, .brand { display: none; } .main { padding: 16px; } }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>

<script>

const PEOPLE = { ak: { name: 'Akshay', role: 'Owner', cls: 'ak', init: 'A' }, pr: { name: 'Priya', role: 'Growth lead (example)', cls: 'pr', init: 'P' }, ag: { name: 'Growth agent', role: 'AI', cls: 'ag', init: 'AI' }, nn: { name: 'Unassigned', role: '', cls: 'nn', init: '?' } };
const WS = { search: 'Search & content', social: 'Social & distribution', store: 'Website & Play Store', retain: 'Activation & retention', loops: 'Referrals & events', partners: 'Partnerships', launch: 'Play launch' };
const STATUSES = ['Suggested', 'Ready', 'In progress', 'In review', 'Done', 'Measured'];
const TASKS = [
  { id: 'T-41', title: 'Get 3 more testers to opt in', ws: 'launch', pri: 0, status: 'In progress', owner: 'ak', due: 'Today', overdue: true, goal: 'O1', effort: '2 h',

  { id: 'T-35', title: 'Review the agent’s PR: free cloud backup page', ws: 'search', pri: 1, status: 'In review', owner: 'ak', reviewer: 'ak', due: 'Fri 31 Oct', goal: 'O2', effort: '20 min', source: 'AI · report 30 Oct',
    why: '"free cloud storage" is rising fast; the page promised "unlimited" and its title was cut off in Google.', evidence: ['Bing US "free cloud storage": 4,769 searches in 12 weeks (was 1,592)', 'Bing US "backup photos": 7,707 (was 1,487)', 'Wikipedia "Cloud storage": +30% year on year'], metric: 'Impressions and Get Lens rate for /features/free-cloud-backup/', baseline: '0 · 0%', target: 'first impressions', check: '27 Nov', links: ['PR #10 · SEO check passed', '/features/free-cloud-backup/'], pr: true },
  { id: 'T-33', title: 'Remove "unlimited" claims across the site', ws: 'search', pri: 0, status: 'In review', owner: 'ak', due: 'Fri 31 Oct', goal: 'O1', effort: '15 min', source: 'AI · report 30 Oct',

  { id: 'T-30', title: 'Post the WhatsApp full-quality guide in 3 communities', ws: 'social', pri: 2, status: 'Ready', owner: 'pr', due: 'Fri 31 Oct', goal: 'O2', effort: '1 h', source: 'AI · report 30 Oct',
    why: 'Distribution, not the website, is the bottleneck: 22 of 24 visits in 30 days were direct.', evidence: ['Website visits 30 days: 24 (web.visits_30d)', 'Direct: 22 (web.source.1)'], metric: 'Visits with utm_source=reddit|whatsapp', baseline: '0', target: '30', check: '14 Nov', links: ['/guides/send-full-quality-photos-whatsapp/'] },
  { id: 'T-29', title: 'Shortlist 20 wedding photographers in Delhi NCR', ws: 'partners', pri: 1, status: 'Ready', owner: 'nn', due: 'Tue 4 Nov', goal: 'O3', effort: '3 h',
    why: 'Photographers bring events every week; 5 partners live is a day-90 key result.', evidence: ['Strategy §3 Phase C: partnerships pilot'], metric: 'Partners in pipeline', baseline: '0', target: '20 leads', check: '11 Nov', links: [] },

];
const GOALS = [
  { id: 'O1', col: 'Now · launch', title: 'Launch on Google Play', status: ['warn', 'At risk'], why: 'Testers opted in is behind pace', krs: [['Testers opted in', 9, 12, 75, 60, 'warn'], ['Closed-test days', 1, 14, 7, 7, 'plain'], ['Pages indexed by Google', 62, 64, 97, 50, 'good']], ms: ['Milestone A · launch prep: 7 of 10 tasks done', 'Blocked: name decision, Play Billing'] },
  { id: 'O2', col: 'Day 30 after launch', title: 'First real users', status: ['plain', 'Starts at launch'], why: 'Targets from the strategy, recalibrated after 4 weeks', krs: [['Installs', 3, 300, 1, 0, 'plain'], ['Weekly backup users', 3, 100, 3, 0, 'plain'], ['Play ratings ≥ 4.5★', 0, 20, 0, 0, 'plain'], ['Events created', 1, 10, 10, 0, 'plain']], ms: ['Milestone B · launch week: 0 of 8 tasks'] },

// ---------- state ----------
let view = 'today';
let boardFilter = 'all';
const $ = (id) => document.getElementById(id);
const av = (k) => `<span class="av ${PEOPLE[k].cls}" title="${PEOPLE[k].name}">${PEOPLE[k].init}</span>`;
const pri = (p) => `<span class="pri p${p}">P${p}</span>`;

function openTask(id) {

  if (!t) return;
  const step = STATUSES.indexOf(t.status);
  $('drawer').innerHTML = `<div class="ch"><span class="tm">${t.id} · ${WS[t.ws]}${t.source ? ' · ' + t.source : ''}</span><button class="btn sm" id="close">Close</button></div>
  <h2>${t.title}</h2>
  <div class="filters">${STATUSES.map((s, i) => `<span class="pill ${i < step ? 'good' : i === step ? 'acc' : 'plain'}">${s}</span>`).join('')}</div>
  <dl class="kv"><dt>Priority</dt><dd>${pri(t.pri)}</dd><dt>Owner</dt><dd>${av(t.owner)} ${PEOPLE[t.owner].name}${t.reviewer ? ` · reviewer ${PEOPLE[t.reviewer].name}` : ''}</dd><dt>Due</dt><dd>${t.due}${t.overdue ? ' <span class="pill bad">Overdue</span>' : ''}</dd><dt>Effort</dt><dd>${t.effort}</dd><dt>Goal</dt><dd><a data-view="goals">${t.goal} · ${(GOALS.find((g) => g.id === t.goal) || {}).title || ''}</a></dd></dl>
  <div class="card" style="padding:12px 14px"><h2>Why</h2><span>${t.why}</span>${t.evidence.map((e) => `<div class="evid">${e}</div>`).join('')}</div>
  <div class="card" style="padding:12px 14px"><h2>Success metric</h2><dl class="kv"><dt>Metric</dt><dd>${t.metric}</dd><dt>Baseline</dt><dd>${t.baseline}</dd><dt>Target</dt><dd>${t.target}</dd><dt>Check on</dt><dd>${t.check}</dd>${t.result ? `<dt>Result</dt><dd>${t.result.value} <span class="pill good">${t.result.verdict}</span></dd>` : ''}</dl></div>
  ${t.links.length ? `<div class="card" style="padding:12px 14px"><h2>Linked</h2>${t.links.map((l) => `<span>${l}</span>`).join('')}</div>` : ''}
  <div class="actions">${t.pr ? '<button class="btn pr">Open PR #10</button>' : ''}${t.status === 'Suggested' ? '<button class="btn pr">Accept</button><button class="btn">Ask agent to draft</button>' : ''}<button class="btn">Change status</button><button class="btn">Reassign</button></div>
  <div class="card" style="padding:12px 14px"><h2>Discussion</h2>
    <div class="cm">${av('pr')}<div><b>Priya</b> <span class="when">today 10:12</span><br>${t.ws === 'search' ? 'Checked the Hindi copy, reads well. One nit on the comparison table.' : 'Spoke to two of them, both keen. Following up tomorrow.'}</div></div>
    <div class="cm">${av('ag')}<div><b>Growth agent</b> <span class="when">today 09:40</span><br>Baseline recorded from this week's data. I'll write the result back on ${t.check}.</div></div>
    <textarea id="comment" placeholder="Add a note, @mention someone…"></textarea></div>
  <div class="hist"><span>Created ${t.source ? 'by the growth agent' : 'by Akshay'} · 30 Oct</span><span>Assigned to ${PEOPLE[t.owner].name} · 30 Oct</span><span>Status → ${t.status} · 30 Oct</span></div>`;
  $('drawer').classList.add('open');
  $('scrim').classList.add('open');
}
function closeTask() { $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); }

function render() {
  renderSide();
  $('main').innerHTML = VIEWS[view]();
  window.scrollTo(0, 0);
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-view],[data-task],[data-filter],#close,#scrim');
  if (!el) return;
  if (el.id === 'close' || el.id === 'scrim') return closeTask();
  if (el.dataset.task) return openTask(el.dataset.task);
  if (el.dataset.filter && !el.dataset.view) { boardFilter = el.dataset.filter; return render(); }
  if (el.dataset.view) { view = el.dataset.view; boardFilter = el.dataset.filter || 'all'; closeTask(); render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeTask(); });
render();
</script>
