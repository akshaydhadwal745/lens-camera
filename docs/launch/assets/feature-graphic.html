<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Geist;src:url(geist-latin.woff2) format('woff2');font-weight:100 900}
html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:#05070d}
.bg{position:absolute;inset:0;background:url(feat-pro-camera.webp) no-repeat;background-size:auto 112%;background-position:calc(100% + 70px) 40%}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,13,1) 0%,rgba(5,7,13,.97) 34%,rgba(5,7,13,.55) 52%,rgba(5,7,13,0) 70%)}
.txt{position:absolute;left:64px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;font-family:Geist,sans-serif;color:#fff;width:470px}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:26px}
.brand img{width:64px;height:64px}
.brand span{font-size:44px;font-weight:700;letter-spacing:-1px}
h1{margin:0;font-size:42px;line-height:1.08;font-weight:700;letter-spacing:-1.2px}
p{margin:18px 0 0;font-size:20px;line-height:1.4;color:rgba(255,255,255,.78);font-weight:450}
</style></head><body><div class="bg"></div><div class="shade"></div>
<div class="txt"><div class="brand"><img src="mark.svg"><span>Lens</span></div>
<h1>Shoot like a pro.<br>Never lose a shot.</h1>
<p>Every photo and video backed up at full quality, the moment you take it.</p></div>
</body></html>
